name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vet (orxotel)
        working-directory: orxotel
        run: go vet ./...
      - name: Test (orxotel)
        working-directory: orxotel
        run: go test -race ./...
      - name: Vet (evals)
        working-directory: evals
        run: go vet ./...
      - name: Test (evals, offline)
        working-directory: evals
        run: go test -race ./...

  postgres:
    name: Test (orxpg, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orx
          POSTGRES_PASSWORD: orx
          POSTGRES_DB: orx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ORX_TEST_PG_DSN: postgres://orx:orx@localhost:5432/orx?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orxpg/go.mod
      - name: Vet (orxpg)
        working-directory: orxpg
        run: go vet ./...
      - name: Test (orxpg)
        working-directory: orxpg
        run: go test -race ./...

  orxdocker:
    name: Test (orxdocker, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orxdocker/go.mod
      - name: Vet
        working-directory: orxdocker
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Test against the runner's Docker daemon
        working-directory: orxdocker
        env:
          ORX_TEST_DOCKER: "1"
        run: go test -race -timeout 15m ./...
      - name: No containers left behind
        run: test -z "$(docker ps -aq --filter label=dev.orchestrix.orxdocker)"

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest patch release, so standard-library findings reflect a
          # toolchain users can actually install.
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: govulncheck (orxotel)
        working-directory: orxotel
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: govulncheck (orxpg)
        working-directory: orxpg
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: govulncheck (evals)
        working-directory: evals
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: govulncheck (orxdocker)
        working-directory: orxdocker
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
